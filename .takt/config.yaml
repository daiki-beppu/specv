# specv 用 takt プロジェクト設定（specv 固有のオーバーライドのみ）
# 詳細とグローバル設定との責任分担は .claude/CLAUDE.md の `# takt` セクション参照

# 自動 PR を作成する場合はドラフトとして作成（試運転段階の安全運用）
draft_pr: true

# provider / model の割り当ては global の ~/.takt/runtime.yaml が持つ（specv では上書きしない）。
